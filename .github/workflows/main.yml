name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Install the exact versions from bun.lock (npm ignores it and can pull
      # newer tooling that skips prerendering).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      # The build writes static files to dist/client or .output/public
      # depending on the environment; collect whichever exists into _site.
      - name: Collect static site
        run: |
          for d in dist/client .output/public; do
            if [ -f "$d/index.html" ]; then
              echo "Using $d"; rm -rf _site; cp -r "$d" _site; break
            fi
          done
          test -f _site/index.html || {
            echo "::error::No index.html in dist/client or .output/public — the build produced no static pages"
            find . -path ./node_modules -prune -o -name '*.html' -print
            exit 1
          }
          find _site -name '*.html'

      - name: SPA fallback for unknown paths
        run: cp _site/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
